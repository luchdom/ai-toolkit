# Pinned external skill imports. See EXTERNAL-SKILLS.md to add, update, or exclude an entry.
# Run from the toolkit checkout with Git and the verified Python 3.11+ interpreter.
# For each platform, the first command previews. The second syncs external skills only.
#
# macOS (zsh)
#   python3 scripts/external_skills.py --tool codex --dry-run
#   python3 scripts/external_skills.py --tool codex
#
# Windows (PowerShell)
#   py -3 scripts/external_skills.py --tool codex --dry-run
#   py -3 scripts/external_skills.py --tool codex
#
# Use --tool all to select all supported agents.
# Normal toolkit sync includes the matching entries. Add --skip-external to scripts/sync.py to skip them for one run.
version = 1

